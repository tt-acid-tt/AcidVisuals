name: Build AcidVisuals

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build mod
        run: gradle --no-daemon build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AcidVisuals-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
