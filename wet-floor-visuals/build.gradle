// Standalone AcidVisuals Wet Floor art/resource generator for Minecraft 1.21.4.
import groovy.json.JsonOutput

plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

def generatedArt = layout.buildDirectory.dir("generated/acidvisuals-resources")
sourceSets.main.resources.srcDir(generatedArt)

tasks.register("generateAcidVisualsArt") {
    outputs.dir(generatedArt)
    doLast {
        File root = generatedArt.get().dir("assets/acidvisuals").asFile
        [new File(root, "textures/gui"), new File(root, "textures/fx"), new File(root, "textures/environment"), new File(root, "textures/font"), new File(root, "font")].each { it.mkdirs() }

        def make = { String path, int w, int h, Closure paint ->
            File file = new File(root, "textures/" + path)
            file.parentFile.mkdirs()
            def image = new java.awt.image.BufferedImage(w, h, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            def g = image.createGraphics()
            g.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
            g.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING, java.awt.RenderingHints.VALUE_RENDER_QUALITY)
            g.setRenderingHint(java.awt.RenderingHints.KEY_STROKE_CONTROL, java.awt.RenderingHints.VALUE_STROKE_PURE)
            paint.call(g, image, w, h)
            g.dispose()
            javax.imageio.ImageIO.write(image, "png", file)
        }
        def rr = { x, y, w, h, r -> new java.awt.geom.RoundRectangle2D.Double(x.doubleValue(), y.doubleValue(), w.doubleValue(), h.doubleValue(), r.doubleValue(), r.doubleValue()) }
        def rng = new java.util.Random(240126L)

        make("gui/panel.png", 1580, 960) { g, img, w, h ->
            g.setPaint(new java.awt.LinearGradientPaint(0f, 0f, 0f, (float)h,
                [0f, 0.45f, 1f] as float[],
                [new java.awt.Color(31, 37, 48, 252), new java.awt.Color(20, 25, 34, 250), new java.awt.Color(11, 15, 23, 248)] as java.awt.Color[]))
            g.fill(rr.call(5, 5, w-10, h-10, 58))
            g.setColor(new java.awt.Color(111, 124, 141, 225))
            g.setStroke(new java.awt.BasicStroke(5f))
            g.draw(rr.call(7, 7, w-14, h-14, 58))
            g.setColor(new java.awt.Color(255, 255, 255, 38))
            g.setStroke(new java.awt.BasicStroke(2f))
            g.draw(rr.call(16, 16, w-32, h-32, 46))
            g.setPaint(new java.awt.GradientPaint(50, 36, new java.awt.Color(255,255,255,34),
                50, 205, new java.awt.Color(255,255,255,0)))
            g.fill(rr.call(28, 19, w-56, 170, 32))
            g.setColor(new java.awt.Color(255,255,255,13))
            g.setStroke(new java.awt.BasicStroke(1.4f))
            g.drawLine(74, 74, w-74, 74)
        }

        def buttonPainter = { boolean hover -> { g, img, w, h ->
            g.setPaint(new java.awt.GradientPaint(0, 0,
                hover ? new java.awt.Color(54, 61, 71, 250) : new java.awt.Color(35, 41, 50, 245),
                0, h, hover ? new java.awt.Color(35, 41, 50, 250) : new java.awt.Color(20, 25, 33, 245)))
            g.fill(rr.call(3, 3, w-6, h-6, 42))
            g.setColor(hover ? new java.awt.Color(185, 196, 209, 225) : new java.awt.Color(99, 111, 126, 155))
            g.setStroke(new java.awt.BasicStroke(3f))
            g.draw(rr.call(3, 3, w-6, h-6, 42))
            g.setColor(new java.awt.Color(255, 255, 255, 30))
            g.setStroke(new java.awt.BasicStroke(2f))
            g.drawLine(24, 9, w-24, 9)
        } }
        make("gui/button.png", 512, 128, buttonPainter(false))
        make("gui/button_hover.png", 512, 128, buttonPainter(true))

        make("gui/toggle_off.png", 256, 128) { g, img, w, h ->
            g.setPaint(new java.awt.GradientPaint(0, 0, new java.awt.Color(34, 46, 61), w, h, new java.awt.Color(13, 22, 35)))
            g.fill(rr.call(3, 3, w-6, h-6, 100))
            g.setColor(new java.awt.Color(119, 150, 176, 180)); g.setStroke(new java.awt.BasicStroke(3f)); g.draw(rr.call(3, 3, w-6, h-6, 100))
            g.setPaint(new java.awt.RadialGradientPaint(62, 64, 52, new float[]{0f,1f}, new java.awt.Color[]{new java.awt.Color(232,245,252),new java.awt.Color(132,157,174)}))
            g.fill(new java.awt.geom.Ellipse2D.Double(10, 12, 104, 104))
        }
        make("gui/toggle_on.png", 256, 128) { g, img, w, h ->
            g.setPaint(new java.awt.GradientPaint(0, 0, new java.awt.Color(93, 236, 255), w, h, new java.awt.Color(51, 115, 234)))
            g.fill(rr.call(3, 3, w-6, h-6, 100))
            g.setColor(new java.awt.Color(175, 250, 255, 235)); g.setStroke(new java.awt.BasicStroke(3f)); g.draw(rr.call(3, 3, w-6, h-6, 100))
            g.setPaint(new java.awt.RadialGradientPaint(196, 64, 60, new float[]{0f,1f}, new java.awt.Color[]{new java.awt.Color(255,255,255,255),new java.awt.Color(205,250,255,235)}))
            g.fill(new java.awt.geom.Ellipse2D.Double(142, 12, 104, 104))
        }
        make("gui/slot.png", 256, 256) { g, img, w, h ->
            g.setPaint(new java.awt.GradientPaint(0,0,new java.awt.Color(54,60,68,255),0,h,new java.awt.Color(37,42,49,255)))
            g.fill(rr.call(5,5,w-10,h-10,34))
            g.setColor(new java.awt.Color(92,101,113,225))
            g.setStroke(new java.awt.BasicStroke(8f))
            g.draw(rr.call(5,5,w-10,h-10,34))
            g.setColor(new java.awt.Color(255,255,255,28))
            g.setStroke(new java.awt.BasicStroke(3f))
            g.drawLine(37,16,w-37,16)
        }
        make("gui/hotbar.png", 1456, 176) { g, img, w, h ->
            g.setPaint(new java.awt.GradientPaint(0,0,new java.awt.Color(47,52,60,255),0,h,new java.awt.Color(28,32,39,255)))
            g.fill(rr.call(5,5,w-10,h-10,44))
            g.setColor(new java.awt.Color(88,96,107,245))
            g.setStroke(new java.awt.BasicStroke(16f))
            g.draw(rr.call(6,6,w-12,h-12,44))
            g.setColor(new java.awt.Color(255,255,255,35))
            g.setStroke(new java.awt.BasicStroke(4f))
            g.drawLine(64,18,w-64,18)
        }
        make("gui/selected_slot.png", 256, 256) { g, img, w, h ->
            g.setColor(new java.awt.Color(255,255,255,18))
            g.fill(rr.call(7,7,w-14,h-14,36))
            g.setColor(new java.awt.Color(255,255,255,255))
            g.setStroke(new java.awt.BasicStroke(15f))
            g.draw(rr.call(8,8,w-16,h-16,36))
            g.setColor(new java.awt.Color(255,255,255,95))
            g.setStroke(new java.awt.BasicStroke(4f))
            g.draw(rr.call(23,23,w-46,h-46,24))
        }

        make("fx/jump_ring.png", 512, 512) { g, img, w, h ->
            g.setPaint(new java.awt.RadialGradientPaint(256,256,250,new float[]{0f,.55f,.78f,1f},new java.awt.Color[]{
                new java.awt.Color(52,205,255,0),new java.awt.Color(65,222,255,0),
                new java.awt.Color(82,236,255,100),new java.awt.Color(35,131,255,0)}))
            g.fillOval(5,5,502,502)
            g.setColor(new java.awt.Color(100,238,255,220)); g.setStroke(new java.awt.BasicStroke(13f)); g.draw(new java.awt.geom.Ellipse2D.Double(28,28,456,456))
            g.setColor(new java.awt.Color(255,255,255,150)); g.setStroke(new java.awt.BasicStroke(4f)); g.draw(new java.awt.geom.Ellipse2D.Double(48,48,416,416))
            for(int i=0;i<12;i++){ double a=i*Math.PI/6.0; double cx=256+220*Math.cos(a), cy=256+220*Math.sin(a); g.setColor(new java.awt.Color(195,251,255,150)); g.fill(new java.awt.geom.Ellipse2D.Double(cx-4,cy-4,8,8)) }
        }
        make("fx/orb.png", 256, 256) { g, img, w, h ->
            g.setPaint(new java.awt.RadialGradientPaint(128,128,124,new float[]{0f,.24f,.52f,.82f,1f},new java.awt.Color[]{
                new java.awt.Color(255,255,255,255),new java.awt.Color(146,251,255,240),
                new java.awt.Color(54,206,255,170),new java.awt.Color(51,128,255,50),new java.awt.Color(40,80,255,0)}))
            g.fillOval(0,0,w,h)
        }
        make("fx/wet_surface.png", 512, 512) { g, img, w, h ->
            // A seamless square sheen tile: no oval or puddle silhouette.
            g.setColor(new java.awt.Color(54, 116, 151, 54))
            g.fillRect(0,0,w,h)
            g.setPaint(new java.awt.LinearGradientPaint(0f,0f,(float)w,(float)h,
                [0f,0.38f,0.62f,1f] as float[],
                [new java.awt.Color(8,24,42,35),new java.awt.Color(100,177,213,82),
                 new java.awt.Color(24,67,96,58),new java.awt.Color(14,35,52,42)] as java.awt.Color[]))
            g.fillRect(0,0,w,h)
            for (int i=0; i<5; i++) {
                float yy = 44f + i*104f
                g.setColor(new java.awt.Color(209,242,255,Math.max(10,42-i*5)))
                g.setStroke(new java.awt.BasicStroke((float)(3 + (i%2)*2), java.awt.BasicStroke.CAP_ROUND, java.awt.BasicStroke.JOIN_ROUND))
                def reflection = new java.awt.geom.Path2D.Double()
                reflection.moveTo(-24, yy+12)
                reflection.curveTo(w*0.22, yy-14, w*0.47, yy+36, w*0.69, yy+4)
                reflection.curveTo(w*0.82, yy-11, w*0.92, yy+19, w+24, yy+1)
                g.draw(reflection)
            }
            g.setPaint(new java.awt.LinearGradientPaint(0f,0f,(float)w,0f,
                [0f,0.28f,0.46f,0.62f,1f] as float[],
                [new java.awt.Color(255,255,255,0),new java.awt.Color(225,247,255,22),
                 new java.awt.Color(255,255,255,105),new java.awt.Color(168,225,255,25),
                 new java.awt.Color(255,255,255,0)] as java.awt.Color[]))
            g.fillRect(0,(int)(h*0.32),w,(int)(h*0.30))
            g.setColor(new java.awt.Color(225,247,255,125))
            g.setStroke(new java.awt.BasicStroke(2.2f))
            g.drawLine(28,h.intdiv(2),w-28,h.intdiv(2))
        }

        def skyPainter = { int style ->
            return { g, img, w, h ->
                float[] stops = [0f, 0.18f, 0.38f, 0.55f, 0.76f, 1f] as float[]
                java.awt.Color[] colors
                if (style == 0) {
                    colors = [new java.awt.Color(5,12,39,255), new java.awt.Color(22,28,76,255),
                        new java.awt.Color(28,76,116,255), new java.awt.Color(26,94,117,255),
                        new java.awt.Color(28,34,76,255), new java.awt.Color(5,10,30,255)] as java.awt.Color[]
                } else if (style == 1) {
                    colors = [new java.awt.Color(7,8,34,255), new java.awt.Color(36,16,84,255),
                        new java.awt.Color(73,30,117,255), new java.awt.Color(91,36,105,255),
                        new java.awt.Color(30,24,72,255), new java.awt.Color(6,9,34,255)] as java.awt.Color[]
                } else if (style == 2) {
                    colors = [new java.awt.Color(13,17,55,255), new java.awt.Color(63,35,98,255),
                        new java.awt.Color(162,68,117,255), new java.awt.Color(235,118,112,255),
                        new java.awt.Color(238,167,111,255), new java.awt.Color(30,31,71,255)] as java.awt.Color[]
                } else {
                    colors = [new java.awt.Color(3,18,47,255), new java.awt.Color(12,46,86,255),
                        new java.awt.Color(18,87,125,255), new java.awt.Color(48,139,164,255),
                        new java.awt.Color(29,61,110,255), new java.awt.Color(4,15,43,255)] as java.awt.Color[]
                }
                g.setPaint(new java.awt.LinearGradientPaint(0f,0f,0f,(float)h,stops,colors))
                g.fillRect(0,0,w,h)

                def skyRng = new java.util.Random(261024L + style * 2917L)
                // Volumetric-looking nebula and aurora clouds, drawn as softly feathered vector gradients.
                for (int i=0; i<54; i++) {
                    float cx = (float)(skyRng.nextInt(w + 300) - 150)
                    float cy = (float)(95 + skyRng.nextInt((int)(h * 0.70)))
                    float radius = (float)(90 + skyRng.nextInt(245))
                    java.awt.Color glow
                    if (style == 0) glow = new java.awt.Color(i % 2 == 0 ? 62 : 40, i % 2 == 0 ? 229 : 122, 234, 48)
                    else if (style == 1) glow = new java.awt.Color(i % 2 == 0 ? 163 : 78, i % 2 == 0 ? 88 : 68, 255, 50)
                    else if (style == 2) glow = new java.awt.Color(i % 2 == 0 ? 255 : 217, i % 2 == 0 ? 136 : 87, 144, 42)
                    else glow = new java.awt.Color(i % 2 == 0 ? 72 : 105, i % 2 == 0 ? 225 : 140, 255, 49)
                    g.setPaint(new java.awt.RadialGradientPaint(cx,cy,radius,
                        [0f,0.34f,0.72f,1f] as float[],
                        [glow, new java.awt.Color(glow.getRed(),glow.getGreen(),glow.getBlue(),24),
                         new java.awt.Color(glow.getRed(),glow.getGreen(),glow.getBlue(),7),
                         new java.awt.Color(glow.getRed(),glow.getGreen(),glow.getBlue(),0)] as java.awt.Color[]))
                    g.fill(new java.awt.geom.Ellipse2D.Double(cx-radius,cy-radius,radius*2,radius*2))
                }

                // Long, layered light ribbons give the panorama a liquid, shifting-shader aesthetic.
                for (int i=0; i<34; i++) {
                    float y = (float)(h * (0.24 + (i % 13) * 0.043) + (skyRng.nextDouble() - 0.5) * 70)
                    float wave = (float)(35 + skyRng.nextDouble() * 115)
                    java.awt.geom.Path2D.Double ribbon = new java.awt.geom.Path2D.Double()
                    ribbon.moveTo(-90, y)
                    ribbon.curveTo(w*0.17, y-wave, w*0.29, y+wave*1.15, w*0.48, y-wave*0.12)
                    ribbon.curveTo(w*0.65, y-wave*0.8, w*0.79, y+wave*0.9, w+90, y-wave*0.22)
                    if (style == 0) g.setColor(new java.awt.Color(i%2==0?106:62, i%2==0?246:188, 255, 14+skyRng.nextInt(28)))
                    else if (style == 1) g.setColor(new java.awt.Color(i%2==0?210:122, 120, 255, 13+skyRng.nextInt(27)))
                    else if (style == 2) g.setColor(new java.awt.Color(255, i%2==0?184:117, 180, 12+skyRng.nextInt(24)))
                    else g.setColor(new java.awt.Color(126, i%2==0?250:180, 255, 14+skyRng.nextInt(26)))
                    g.setStroke(new java.awt.BasicStroke((float)(6 + skyRng.nextDouble()*34),
                        java.awt.BasicStroke.CAP_ROUND, java.awt.BasicStroke.JOIN_ROUND))
                    g.draw(ribbon)
                }

                if (style == 2) {
                    float sx = w * 0.71f, sy = h * 0.53f, sr = h * 0.22f
                    g.setPaint(new java.awt.RadialGradientPaint(sx,sy,sr,
                        [0f,0.28f,0.6f,1f] as float[],
                        [new java.awt.Color(255,241,209,250), new java.awt.Color(255,178,170,170),
                         new java.awt.Color(255,130,164,60), new java.awt.Color(255,130,164,0)] as java.awt.Color[]))
                    g.fill(new java.awt.geom.Ellipse2D.Double(sx-sr,sy-sr,sr*2,sr*2))
                }

                // Crisp stars at multiple sizes over a softened high-resolution sky.
                int stars = style == 2 ? 170 : 430
                for (int i=0; i<stars; i++) {
                    int x = skyRng.nextInt(w)
                    int y = skyRng.nextInt((int)(h * 0.69))
                    int size = skyRng.nextInt(100) < 8 ? 3 : (skyRng.nextInt(100) < 22 ? 2 : 1)
                    int alpha = 60 + skyRng.nextInt(175)
                    g.setColor(new java.awt.Color(218 + skyRng.nextInt(38), 226 + skyRng.nextInt(30), 255, alpha))
                    g.fill(new java.awt.geom.Ellipse2D.Double(x,y,size,size))
                    if (size == 3 && i % 7 == 0) {
                        g.setStroke(new java.awt.BasicStroke(1.1f))
                        g.drawLine(x-3,y,x+4,y)
                        g.drawLine(x,y-3,x,y+4)
                    }
                }

                // Fine reflective cloud streaks across the horizon.
                for (int i=0; i<24; i++) {
                    int x = skyRng.nextInt(w)
                    int y = (int)(h * (0.56 + skyRng.nextDouble() * 0.25))
                    g.setColor(new java.awt.Color(219,239,255,12+skyRng.nextInt(25)))
                    g.setStroke(new java.awt.BasicStroke((float)(2 + skyRng.nextDouble()*9),
                        java.awt.BasicStroke.CAP_ROUND, java.awt.BasicStroke.JOIN_ROUND))
                    g.drawLine(x,y,x+70+skyRng.nextInt(200),y-skyRng.nextInt(17))
                }
            }
        }
        make("environment/sky_aurora.png", 2048, 1024, skyPainter(0))
        make("environment/sky_nebula.png", 2048, 1024, skyPainter(1))
        make("environment/sky_sunset.png", 2048, 1024, skyPainter(2))
        make("environment/sky_dream.png", 2048, 1024, skyPainter(3))

        def glyphSet = new LinkedHashSet<Character>()
        for (int cp=32; cp<=126; cp++) glyphSet.add((char)cp)
        [0x00A0,0x00B0,0x00B7,0x00D7,0x00F7,0x00DF,0x00E9,0x00E4,0x00F6,0x00FC,0x2013,0x2014,0x2022,0x2190,0x2191,0x2192,0x2193,0x2194,0x221E,0x2248,0x2713,0x2116,0x20BD].each { glyphSet.add((char)(int)it) }
        for (int cp=0x0410; cp<=0x044F; cp++) glyphSet.add((char)cp)
        glyphSet.add((char)0x0401); glyphSet.add((char)0x0451)
        for (int cp=0x0370; glyphSet.size()<256 && cp<0x5000; cp++) {
            if (!Character.isSurrogate((char)cp) && Character.isDefined((char)cp)) glyphSet.add((char)cp)
        }
        def glyphs = new ArrayList<Character>(glyphSet).take(256)
        while (glyphs.size()<256) glyphs.add((char)(0x5000 + glyphs.size()))
        File atlasFile = new File(root, "textures/font/glyphs.png")
        def atlas = new java.awt.image.BufferedImage(1024,1024,java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def fg = atlas.createGraphics()
        fg.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
        fg.setRenderingHint(java.awt.RenderingHints.KEY_TEXT_ANTIALIASING, java.awt.RenderingHints.VALUE_TEXT_ANTIALIAS_ON)
        fg.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING, java.awt.RenderingHints.VALUE_RENDER_QUALITY)
        fg.setFont(new java.awt.Font("DejaVu Sans", java.awt.Font.BOLD, 50))
        def fm = fg.getFontMetrics()
        for(int i=0;i<256;i++){
            char ch = glyphs.get(i)
            int cellX=(i%16)*64, cellY=(i.intdiv(16))*64
            fg.setColor(new java.awt.Color(255,255,255,255))
            String str=String.valueOf(ch)
            int sw=fm.stringWidth(str)
            int sx=cellX+Math.max(1,(64-sw).intdiv(2))
            int baseline=cellY+53
            if (!Character.isISOControl(ch)) fg.drawString(str,sx,baseline)
        }
        fg.dispose()
        javax.imageio.ImageIO.write(atlas,"png",atlasFile)
        def charRows=[]
        for(int row=0;row<16;row++){
            StringBuilder sb=new StringBuilder()
            for(int col=0;col<16;col++) sb.append(glyphs.get(row*16+col).charValue())
            charRows << sb.toString()
        }
        File fontJson = new File(root, "font/acid.json")
        fontJson.parentFile.mkdirs()
        fontJson.text = JsonOutput.prettyPrint(JsonOutput.toJson([providers:[[type:"bitmap", file:"acidvisuals:font/glyphs.png", ascent:13, height:16, chars:charRows]]]))
    }
}

tasks.named("processResources").configure { dependsOn(tasks.named("generateAcidVisualsArt")) }
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
}
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
tasks.named("sourcesJar").configure { dependsOn(tasks.named("generateAcidVisualsArt")) }
